<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Model Canvas — Spotify</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <!-- Logo SVG oficial de Spotify (monocromo, sin píldora) -->
    <svg class="spotify-logo" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.359-.66.48-1.02.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.263.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 4.259-1.2 9.659-.539 13.439 1.74.36.18.539.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.42-1.02.599-1.559.3z"/>
    </svg>
    <h1>Business Model Canvas de Spotify</h1>
    <p>Haz clic en un bloque para ver su detalle completo en una ventana.</p>
  </header>

  <!-- La grilla se construye desde BMC_DATA (data.js) -->
  <main class="bmc-grid" id="bmc-grid" aria-label="Business Model Canvas"></main>

  <!-- Modal de detalle: el contenido se llena dinámicamente desde data.js -->
  <dialog class="bmc-modal" id="bmc-modal" aria-modal="true" aria-labelledby="modal-title">
    <button type="button" class="modal-close" aria-label="Cerrar detalle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-icon" aria-hidden="true"></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-subtitle"></p>
    <span class="modal-metric"></span>
    <p class="modal-label">Detalle completo</p>
    <ul class="modal-points"></ul>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
